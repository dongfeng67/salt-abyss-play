name: Deploy Godot Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify game pack
        run: |
          cat pack/index.pck.* > site/index.pck
          echo '527816d75e7fbd8eb28b5ba1901d7582a6b178b9e9ebace7399e87cc1ddff15a  site/index.pck' | sha256sum --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
