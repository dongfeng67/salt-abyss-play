name: Deploy Godot Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify game pack
        run: |
          cat pack/game-038-fix1.pck.* > site/game-038-fix1.pck
          echo '1fd5c0a862e192199e1adb124dec25ea006abac593e00861394876e9fecc16ed  site/game-038-fix1.pck' | sha256sum --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
