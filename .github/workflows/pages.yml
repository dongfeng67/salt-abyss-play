name: Deploy Godot Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify game pack
        run: |
          cat pack/game-04333.pck.* > site/game-04333.pck
          echo '40efcdb8c0dab385ad04ae6af4e50834e0155d6c13b82e46b74038f4298226de  site/game-04333.pck' | sha256sum --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
